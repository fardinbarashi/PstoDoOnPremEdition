<script>try { var th = localStorage.getItem('pstodo.theme'); if (th === 'light' || th === 'dark') document.documentElement.setAttribute('data-theme', th); } catch (e) { }</script>
<style>
:root {
  --side: #27303a; --side-2: #1f262e; --side-text: #aab4bf; --side-active: #2ab3a6;
  --bg: #eef1f4; --card: #ffffff; --card-2: #f7f9fb; --line: #e3e7ec; --line-2: #d3d9e0;
  --text: #2a323c; --muted: #6b7682; --dim: #9aa3ad;
  --head: #343e4a; --head-text: #ffffff;
  --accent: #2ab3a6; --accent-2: #239a8f; --accent-soft: rgba(42,179,166,.12);
  --expired: #d64545; --critical: #e2703a; --warning: #c9930f; --ok: #2f9e6e; --none: #8a95a1;
  --backlog: #6b7682; --active: #2f74c0; --completed: #2f9e6e;
  --warn-bg: #fff6e0; --warn-line: #f0c75e;
  --shadow: 0 1px 2px rgba(20,30,40,.06), 0 2px 8px rgba(20,30,40,.04);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --side: #151a20; --side-2: #10141a; --side-text: #8d98a4;
    --bg: #0f1317; --card: #181d23; --card-2: #1d232a; --line: #262d35; --line-2: #313943;
    --text: #e3e8ed; --muted: #9aa5b0; --dim: #6f7a85;
    --head: #222a33; --head-text: #e9eef3;
    --accent-soft: rgba(42,179,166,.18);
    --warn-bg: rgba(201,147,15,.14); --warn-line: #8a6a12;
    --shadow: none;
  }
}
:root[data-theme="dark"] {
    --side: #151a20; --side-2: #10141a; --side-text: #8d98a4;
    --bg: #0f1317; --card: #181d23; --card-2: #1d232a; --line: #262d35; --line-2: #313943;
    --text: #e3e8ed; --muted: #9aa5b0; --dim: #6f7a85;
    --head: #222a33; --head-text: #e9eef3;
    --accent-soft: rgba(42,179,166,.18);
    --warn-bg: rgba(201,147,15,.14); --warn-line: #8a6a12;
    --shadow: none;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 13.5px/1.5 "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- shell */
.app { display: grid; grid-template-columns: 92px 1fr; min-height: 100vh; }
.side { background: var(--side); color: var(--side-text); display: flex; flex-direction: column; align-items: stretch; position: sticky; top: 0; height: 100vh; }
.brand { height: 72px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #fff; background: var(--side-2); font-size: 10.5px; letter-spacing: .04em; }
.brand svg.mark { width: 46px; height: 39px; }
.nav { display: flex; flex-direction: column; padding: 6px 0; gap: 2px; }
.nav a { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 12px 4px; color: var(--side-text); font-size: 10.5px; text-align: center; line-height: 1.2; position: relative; }
.nav a svg.i { width: 22px; height: 22px; }
.nav a:hover { color: #fff; text-decoration: none; background: rgba(255,255,255,.04); }
.nav a.active { background: var(--side-active); color: #fff; }
.nav a .cnt { position: absolute; top: 6px; right: 14px; background: var(--expired); color: #fff; border-radius: 9px; font-size: 10px; padding: 0 5px; line-height: 16px; }
.nav .sep { height: 1px; background: rgba(255,255,255,.08); margin: 8px 14px; }
.side .foot { margin-top: auto; padding: 10px 6px 14px; font-size: 10px; text-align: center; color: var(--dim); }

.main { min-width: 0; display: flex; flex-direction: column; }
.top { height: 60px; background: var(--card); border-bottom: 1px solid var(--line); display: flex; align-items: stretch; position: sticky; top: 0; z-index: 5; }
.pslogo { display: flex; align-items: center; gap: 10px; padding: 0 22px 0 24px; border-right: 1px solid var(--line); text-decoration: none; flex: none; }
.pslogo:hover { text-decoration: none; }
.pslogo svg.mark { width: 38px; height: 32px; flex: none; }
.pslogo .lt { display: flex; flex-direction: column; line-height: 1.05; }
.pslogo .lt b { font-size: 19px; font-weight: 800; letter-spacing: -.02em; color: var(--text); }
.pslogo .lt small { font-size: 11.5px; color: var(--muted); letter-spacing: .01em; margin-top: 2px; }
.crumbs { display: flex; align-items: center; gap: 8px; padding: 0 24px; color: var(--muted); font-size: 13px; min-width: 0; flex: 1; overflow: hidden; white-space: nowrap; }
.crumbs b { color: var(--text); font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
.crumbs .slash { color: var(--dim); }
.actions { display: flex; }
.actions button, .actions a { width: 60px; border: none; border-left: 1px solid rgba(255,255,255,.18); background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; }
.actions button:hover, .actions a:hover { background: var(--accent-2); text-decoration: none; }
.actions svg.i { width: 20px; height: 20px; }

/* ---------- header strip */
.strip { background: var(--card); border-bottom: 1px solid var(--line); padding: 22px 28px 0; }
.strip-grid { display: grid; grid-template-columns: minmax(200px, 1.3fr) repeat(4, minmax(130px, 1fr)) auto; gap: 18px 28px; align-items: start; padding-bottom: 18px; }
.ident .tag { color: var(--dim); font-size: 11px; }
.ident .org { font-size: 15px; font-weight: 600; }
.ident .sub { color: var(--muted); }
.fact .lab { font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--dim); margin-bottom: 3px; }
.fact .val { font-weight: 600; }
.fact .warn { color: var(--warning); }
.tabs .attn { margin-left: auto; align-self: center; font-size: 12px; color: var(--muted); white-space: nowrap; }
.tabs .attn a { padding: 0; border: none; text-transform: none; letter-spacing: 0; font-weight: 400; font-size: 12px; color: var(--accent); }
.tabs .attn svg.i { width: 14px; height: 14px; vertical-align: -2px; color: var(--warning); }
.fact .val small { color: var(--muted); font-weight: 400; }
.logo { display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 120px; }
.logo img { max-height: 54px; max-width: 170px; }
.tabs { display: flex; gap: 26px; border-top: 1px solid var(--line); overflow-x: auto; }
.tabs a { padding: 12px 0 10px; font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; font-weight: 600; }
.tabs a:hover { color: var(--text); text-decoration: none; }
.tabs a.active { color: var(--accent); border-bottom-color: var(--accent); }
.tabs a .c { color: var(--dim); font-weight: 400; margin-left: 4px; }

.banner { margin: 16px 28px 0; padding: 10px 14px; border-radius: 6px; background: var(--warn-bg); border: 1px solid var(--warn-line); display: flex; gap: 10px; align-items: center; }
.banner svg.i { color: var(--warning); }

/* ---------- content */
body.editing .strip, body.editing #banners { display: none; }
body.editing .content { display: none; }
.editframe { display: block; width: 100%; height: calc(100vh - 60px); border: 0; background: var(--bg); }
.content { padding: 22px 28px 48px; display: flex; flex-direction: column; gap: 20px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 6px; box-shadow: var(--shadow); min-width: 0; }
.card > .hd { background: var(--head); color: var(--head-text); padding: 11px 18px; border-radius: 6px 6px 0 0; display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 13px; }
.card > .hd .right { margin-left: auto; font-weight: 400; opacity: .8; font-size: 12px; }
.card > .hd.light { background: transparent; color: var(--text); border-bottom: 1px solid var(--line); }
.card > .bd { padding: 16px 18px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.grid-detail { display: grid; grid-template-columns: minmax(300px, 0.9fr) 1.1fr; gap: 20px; align-items: start; }
.col { display: flex; flex-direction: column; gap: 20px; min-width: 0; }

.cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px 14px 18px; box-shadow: var(--shadow); position: relative; cursor: pointer; text-align: left; font: inherit; color: inherit; }
.stat::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; border-radius: 6px 0 0 6px; background: var(--c); }
.stat:hover { border-color: var(--line-2); }
.stat .n { font-size: 26px; font-weight: 600; line-height: 1.1; color: var(--c); }
.stat .t { font-weight: 600; margin-top: 2px; }
.stat .d { color: var(--muted); font-size: 12px; }

/* ---------- timeline */
.tl svg.chart { width: 100%; height: auto; display: block; }
.tl .legend { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; color: var(--muted); font-size: 12px; margin-top: 10px; }
.sw { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; color: var(--text); }
.sw input { position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none; }
.sw .track { position: relative; width: 30px; height: 17px; border-radius: 9px; background: var(--line-2); transition: background .15s; flex: none; }
.sw .track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 13px; height: 13px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform .15s; }
.sw input:checked + .track { background: var(--accent); }
.sw input:checked + .track::after { transform: translateX(13px); }
.sw input:focus-visible + .track { outline: 2px solid var(--accent); outline-offset: 2px; }
.sw .n { color: var(--muted); }
.sw .dot { margin-right: 0; }
.sw.off .dot { opacity: .35; }
.tl .legend .later { color: var(--expired); align-self: center; }
.sw.off { color: var(--muted); }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--c); margin-right: 6px; vertical-align: 0; }
.tl-mark { cursor: pointer; }
.card > .hd .tools { margin-left: auto; display: flex; align-items: center; gap: 12px; font-weight: 400; }
.dd { position: relative; display: inline-flex; align-items: center; width: 150px; height: 26px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.28); border-radius: 4px; }
.dd:focus-within { border-color: var(--accent); }
.dd.bad { border-color: #e5484d; box-shadow: 0 0 0 1px #e5484d; }
.dd input { flex: 1 1 auto; min-width: 0; width: 100%; height: 100%; background: transparent; color: var(--head-text); border: none; font: inherit; font-size: 11.5px; padding: 0 0 0 9px; }
.dd input:focus { outline: none; }
.dd input::placeholder { color: rgba(255,255,255,.5); font-weight: 400; opacity: 1; }
.dd .unit { font-size: 11.5px; color: var(--head-text); opacity: .55; flex: 0 0 auto; padding: 0 8px 0 4px; pointer-events: none; }
.dd input:placeholder-shown + .unit { display: none; }
.dd .open { flex: 0 0 26px; display: grid; place-items: center; width: 26px; height: 100%; background: transparent; color: var(--head-text); border: none; border-left: 1px solid rgba(255,255,255,.18); cursor: pointer; padding: 0; }
.dd .open svg { width: 14px; height: 14px; transition: transform .15s; }
.dd.on .open svg { transform: rotate(180deg); }
.dd .open:hover { background: rgba(255,255,255,.08); }
.dd ul { display: none; position: absolute; top: calc(100% + 4px); right: -1px; left: -1px; z-index: 30; margin: 0; padding: 4px; list-style: none; background: var(--card); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 8px 24px rgba(0,0,0,.18); }
.dd.on ul { display: block; }
.dd li { display: flex; justify-content: space-between; align-items: center; padding: 6px 9px; border-radius: 4px; color: var(--text); font-size: 12.5px; font-weight: 400; cursor: pointer; }
.dd li:hover, .dd li.hi { background: var(--hover, rgba(127,127,127,.12)); }
.dd li[aria-selected="true"] { color: var(--accent); font-weight: 600; }
.dd li[aria-selected="true"]::after { content: "\2713"; }
.dd li.hint { display: block; margin: 4px -4px -4px; padding: 8px 13px 9px; border-top: 1px solid var(--line); border-radius: 0; color: var(--muted); font-size: 12px; line-height: 1.45; cursor: default; }
.dd li.hint:hover { background: none; }
.hd .cnt-txt { font-size: 12px; opacity: .8; min-width: 70px; text-align: right; }
.collapse { background: transparent; border: none; color: var(--head-text); border-radius: 4px; width: 28px; height: 24px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
.collapse:hover { background: rgba(255,255,255,.1); }
.collapse svg.i { width: 16px; height: 16px; transition: transform .15s; transform: rotate(180deg); }
.card.closed .collapse svg.i { transform: none; }
.card.closed > .hd { border-radius: 6px; }
.card.closed > .bd { display: none; }
.tl-mark:hover circle { stroke-width: 3; }

/* ---------- lists / feed */
.feed { list-style: none; margin: 0; padding: 0; }
.feed li { display: grid; grid-template-columns: 34px 1fr; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.feed li:last-child { border-bottom: none; }
.feed .ic { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--card-2); color: var(--muted); }
.feed .ic svg.i { width: 16px; height: 16px; }
.feed .ic.sent { color: var(--ok); background: color-mix(in srgb, var(--ok) 12%, transparent); }
.feed .ic.due { color: var(--critical); background: color-mix(in srgb, var(--critical) 12%, transparent); }
.feed .ic.skipped { color: var(--dim); }
.feed .when { font-size: 11.5px; color: var(--dim); }
.feed .what { margin-top: 1px; }
.feed .what a { font-weight: 600; }
.empty { color: var(--muted); padding: 18px 0; text-align: center; }

/* ---------- table */
.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.toolbar .grow { flex: 1; }
input[type=search], select { font: inherit; color: var(--text); background: var(--card); border: 1px solid var(--line-2); border-radius: 4px; padding: 6px 9px; }
input[type=search] { width: 280px; max-width: 100%; }
input[type=search]:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.count { color: var(--muted); font-size: 12.5px; }
.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; table-layout: fixed; }
th { text-align: left; font-size: 10.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--dim); font-weight: 600; padding: 11px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; user-select: none; }
th.sort { cursor: pointer; }
th.sort:hover { color: var(--text); }
th .ar { color: var(--accent); }
td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
tbody tr { cursor: pointer; }
tbody tr:hover td { background: var(--card-2); }
tbody tr:last-child td { border-bottom: none; }
.r { text-align: right; }
td.name b { font-weight: 600; display: block; overflow: hidden; text-overflow: ellipsis; }
td.name span { color: var(--muted); font-size: 12px; display: block; overflow: hidden; text-overflow: ellipsis; }
.muted { color: var(--muted); }
.neg { color: var(--expired); }
.badge { display: inline-block; padding: 2px 9px; border-radius: 10px; font-size: 11.5px; font-weight: 600; color: var(--c); background: color-mix(in srgb, var(--c) 13%, transparent); white-space: nowrap; }
.pill { display: inline-block; padding: 1px 8px; border-radius: 3px; font-size: 11.5px; border: 1px solid color-mix(in srgb, var(--c) 45%, transparent); color: var(--c); white-space: nowrap; }
.next b { font-weight: 600; }
.next .ch { color: var(--muted); }
.next.today b { color: var(--critical); }

/* ---------- detail */
.back { display: inline-flex; align-items: center; gap: 4px; color: var(--text); font-size: 12.5px; }
.back svg.i { width: 15px; height: 15px; }
.detail-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.detail-actions { display: flex; gap: 18px; }
.detail-actions a, .detail-actions button { display: inline-flex; align-items: center; gap: 6px; color: var(--text); background: none; border: none; font: inherit; font-size: 12.5px; cursor: pointer; padding: 0; }
.detail-actions svg.i { width: 16px; height: 16px; color: var(--muted); }
.who { display: flex; align-items: center; gap: 14px; margin: 4px 0 2px 2px; }
.avatar { width: 46px; height: 46px; border-radius: 50%; border: 2px solid var(--c); display: flex; align-items: center; justify-content: center; color: var(--c); background: var(--card); flex: none; }
.avatar svg.i { width: 22px; height: 22px; }
.who h2 { margin: 0; font-size: 17px; font-weight: 600; }
.who .sub { color: var(--muted); }
.kv { display: grid; grid-template-columns: 130px 1fr; }
.kv > div { padding: 11px 0; border-bottom: 1px solid var(--line); min-width: 0; overflow-wrap: anywhere; }
.kv > div:nth-last-child(-n+2) { border-bottom: none; }
.kv .k { font-size: 10.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--dim); font-weight: 600; padding-top: 13px; }
.subtabs { display: flex; gap: 22px; border-bottom: 1px solid var(--line); padding: 0 18px; }
.subtabs button { background: none; border: none; font: inherit; font-weight: 600; font-size: 12.5px; padding: 12px 0 10px; color: var(--muted); border-bottom: 2px solid transparent; cursor: pointer; }
.subtabs button.active { color: var(--text); border-bottom-color: var(--accent); }
.prose { white-space: pre-wrap; }

/* ---------- responsive */
@media (max-width: 1180px) {
  .strip-grid { grid-template-columns: 1fr 1fr 1fr; }
  .logo { display: none; }
  .grid2, .grid-detail { grid-template-columns: 1fr; }
}
@media (max-width: 760px) {
  .app { grid-template-columns: 64px 1fr; }
  .nav a span { display: none; }
  .cards { grid-template-columns: 1fr 1fr; }
  .strip-grid { grid-template-columns: 1fr 1fr; }
  .content, .strip { padding-left: 16px; padding-right: 16px; }
}

/* ---------- print */
@media print {
  .card.closed > .bd { display: block; }
  .dd, .collapse { display: none !important; }
  :root { --bg: #fff; --card: #fff; --card-2: #fff; --text: #000; --muted: #444; --dim: #666; --line: #ccc; --head: #e9ecef; --head-text: #000; --shadow: none; }
  body { font-size: 10.5pt; }
  .app { display: block; }
  .side, .actions, .toolbar, .banner .noprint, .detail-actions, .tabs, .no-print { display: none !important; }
  .top { position: static; height: auto; border: none; }
  .crumbs { padding: 0 0 6px; }
  .pslogo { padding: 0 18px 8px 0; }
  .strip { padding: 0 0 10px; }
  .content { padding: 10px 0; gap: 12px; }
  .card { break-inside: avoid; border-color: #bbb; }
  tbody tr { break-inside: avoid; }
  td, th { white-space: normal; padding: 5px 6px; }
  .tablewrap { overflow: visible; }
  a { color: #000; }
}
</style>
</head>
<body>
<div class="app">
  <aside class="side" aria-label="Navigation">
    <div class="brand" id="brand"></div>
    <nav class="nav" id="nav"></nav>
    <div class="foot" id="sidefoot"></div>
  </aside>
  <div class="main">
    <header class="top">

  function renderTimeline() {
    var span = UI.tlDays || 90, W = 1000, L = 20, R = 20, top = 34, lane = 22;
    document.getElementById('tlTitle').textContent = t('timeline', { n: span });
    var step = span <= 14 ? 1 : span <= 120 ? 7 : span <= 200 ? 14 : span <= 400 ? 30 : Math.ceil(span / 12 / 30) * 30;
    var show = UI.tlShow;
    var inRange = D.monitored.filter(function (r) { return r.days !== null && r.days <= span; });
    var expired = inRange.filter(function (r) { return r.days < 0; });
    var cnt = { expired: 0, critical: 0, warning: 0, ok: 0 };
    inRange.forEach(function (r) { var u = r.days < 0 ? 'expired' : r.urgency; if (cnt[u] !== undefined) cnt[u]++; });
    var EZ = show.expired && expired.length ? Math.min(160, 10 + expired.length * 17) : 0, X0 = L + (EZ ? EZ + 22 : 0);
    var X = function (d) { return X0 + (d / span) * (W - X0 - R); };
    var items = inRange.filter(function (r) { return show[r.days < 0 ? 'expired' : r.urgency] !== false; }).sort(function (a, b) { return a.days - b.days; });
    document.getElementById('tlCount').textContent = t('objectsN', { n: items.length });
    var lanes = [];
    var perRow = Math.max(1, Math.floor((EZ - 10) / 17));
    items.filter(function (r) { return r.days < 0; }).forEach(function (r, i) { r._ex = i; });
    var PX = function (r) { return r.days < 0 ? L + 13 + (r._ex % perRow) * 17 : X(r.days); };
    items.forEach(function (r) {
      var x = PX(r), li = 0;
      if (r.days < 0) { r._lane = Math.floor(r._ex / perRow); return; }
      while (lanes[li] !== undefined && x - lanes[li] < 16) li++;
      lanes[li] = x; r._lane = li;
    });
    var exN = items.filter(function (r) { return r.days < 0; }).length;
    var H = top + Math.max(1, lanes.length, Math.ceil(exN / perRow)) * lane + 34;
    var g = [];
    if (EZ) {
      g.push('<line x1="' + (X0 - 11) + '" x2="' + (X0 - 11) + '" y1="' + (top - 14) + '" y2="' + (H - 26) + '" stroke="var(--line-2)" stroke-dasharray="3 3" />');
      g.push('<text x="' + (L + EZ / 2) + '" y="' + (H - 8) + '" text-anchor="middle" font-size="11" fill="var(--dim)">' + esc(t('expired')) + '</text>');
    }
    // grid
    for (var d = 0; d <= span; d += step) {
      var dt = new Date(TODAY.getTime() + d * 864e5), x = X(d);
      g.push('<line x1="' + x + '" x2="' + x + '" y1="' + (top - 8) + '" y2="' + (H - 26) + '" stroke="var(--line)" />');
      g.push('<text x="' + x + '" y="' + (H - 8) + '" text-anchor="middle" font-size="11" fill="var(--dim)">' + esc(d === 0 ? t('today') : fDate(dt, false)) + '</text>');
    }
    g.push('<line x1="' + X(0) + '" x2="' + X(0) + '" y1="' + (top - 14) + '" y2="' + (H - 26) + '" stroke="var(--accent)" stroke-width="2" />');
    items.forEach(function (r) {
      var x = PX(r), y = top + r._lane * lane + 6;
      g.push('<g class="tl-mark" data-id="' + esc(r.id) + '" tabindex="0" role="link" aria-label="' + esc(r.name + ', ' + fDate(r.expire)) + '">' +
        '<title>' + esc(r.name + ' – ' + fDate(r.expire, true) + ' (' + relDays(r.days) + ')' + (r.owner ? ' – ' + r.owner : '')) + '</title>' +
        '<circle cx="' + x + '" cy="' + y + '" r="7" fill="var(' + UC[r.days < 0 ? 'expired' : r.urgency] + ')" fill-opacity=".9" stroke="var(--card)" stroke-width="2" /></g>');
    });
    var legend = ['expired', 'critical', 'warning', 'ok'].map(function (u) {
      var on = show[u] !== false;
      return '<label class="sw' + (on ? '' : ' off') + '" title="' + esc(t(on ? 'tlHide' : 'tlShow', { what: t(u) })) + '">' +
        '<input type="checkbox" role="switch" data-u="' + u + '"' + (on ? ' checked' : '') + '><span class="track"></span><i class="dot" style="--c:var(' + UC[u] + ')"></i>' + esc(t(u)) + ' <span class="n">' + cnt[u] + '</span></label>';
    }).join('');
    var laterN = D.monitored.filter(function (r) { return r.days !== null && r.days > span; }).length;
    if (show.expired && laterN) legend += '<span class="later" id="tlLater">' + esc(t('tlLater', { n: laterN, span: span })) + '</span>';
    document.getElementById('tl').innerHTML = (items.length ? '' : '<div class="empty">' + esc(t(inRange.length ? 'tlAllHidden' : 'tlNone', { n: span })) + '</div>') +
      '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(t('timeline', { n: span })) + '">' + g.join('') + '</svg><div class="legend">' + legend + '</div>';
    document.querySelectorAll('.tl-mark').forEach(function (m) {
      var open = function () { go('#object/monitored/' + encodeURIComponent(m.getAttribute('data-id'))); };
      m.addEventListener('click', open);
      m.addEventListener('keydown', function (e) { if (e.key === 'Enter') open(); });
    });
    document.querySelectorAll('#tl .sw input').forEach(function (c) {
      c.onchange = function () {
        UI.tlShow[c.getAttribute('data-u')] = c.checked; save('tlShow', JSON.stringify(UI.tlShow));
        renderTimeline();
        var again = document.querySelector('#tl .sw input[data-u="' + c.getAttribute('data-u') + '"]'); if (again) again.focus();
      };
    });
  }

    var toolbar = '<div class="toolbar">' +
      '<input type="search" id="q" placeholder="' + esc(t('search')) + '" value="' + esc(UI.q) + '" aria-label="' + esc(t('search')) + '">' +
      (hasUrg ? '<select id="fu" aria-label="' + esc(t('cUrgency')) + '"><option value="">' + esc(t('allUrg')) + '</option>' +
        ['expired', 'critical', 'warning', 'ok', 'none'].map(function (u) { return '<option value="' + u + '"' + (UI.urg === u ? ' selected' : '') + '>' + esc(uLabel(u)) + '</option>'; }).join('') + '</select>' : '') +
      (hasStatus ? '<select id="fs" aria-label="' + esc(t('cStatus')) + '"><option value="">' + esc(t('allStatus')) + '</option>' +
        ['Backlog', 'Active', 'Completed'].map(function (s) { return '<option' + (UI.status === s ? ' selected' : '') + '>' + s + '</option>'; }).join('') + '</select>' : '') +
      '<select id="fo" aria-label="' + esc(t('cOwner')) + '"><option value="">' + esc(t('allOwners')) + '</option>' + ownerOpts + '</select>' +
      '<span class="grow"></span><span class="count">' + esc(t('shown', { a: f.rows.length, b: f.total })) + '</span></div>';

    var head = '<colgroup>' + f.cols.map(function (c) { return '<col' + (c.w ? ' style="width:' + c.w + 'px"' : '') + '>'; }).join('') + '</colgroup><thead><tr>' +
      f.cols.map(function (c) {
        var ar = f.sort[0] === c.k ? ' <span class="ar">' + (f.sort[1] > 0 ? '▲' : '▼') + '</span>' : '';
        return '<th class="sort ' + (c.cls || '') + '" data-k="' + c.k + '" title="' + esc(t(c.l)) + '">' + esc(t(c.l)) + ar + '</th>';
      }).join('') + '</tr></thead>';
    var clickable = tab !== 'invalid' && tab !== 'nocreds';
    var body = f.rows.map(function (x) {
      return '<tr' + (clickable ? ' data-id="' + esc(x.id) + '" tabindex="0"' : ' style="cursor:default"') + '>' + f.cols.map(function (c) {
        return c.td ? c.td(x) : '<td class="' + (c.cls || '') + '">' + c.v(x) + '</td>';
      }).join('') + '</tr>';
    }).join('');
    var note = tab === 'completed' ? '<div class="count" style="margin-top:10px">' + esc(t('completedNote', { f: M.completeFile })) + '</div>' : '';

    document.getElementById('view').innerHTML = toolbar +
      '<div class="card"><div class="tablewrap"><table>' + head + '<tbody>' + (body || '<tr style="cursor:default"><td colspan="' + f.cols.length + '" class="empty">&ndash;</td></tr>') + '</tbody></table></div></div>' + note;

    var q = document.getElementById('q');
    q.oninput = function () { UI.q = q.value; var pos = q.selectionStart; renderObjects(r); var n = document.getElementById('q'); n.focus(); n.setSelectionRange(pos, pos); };
    ['fu', 'fs', 'fo'].forEach(function (id) {
      var el = document.getElementById(id); if (!el) return;
      el.onchange = function () { UI[{ fu: 'urg', fs: 'status', fo: 'owner' }[id]] = el.value; renderObjects(r); };
    });
    document.querySelectorAll('th.sort').forEach(function (th) {
      th.onclick = function () { var k = th.getAttribute('data-k'), s = f.sort; UI.sort[tab] = s[0] === k ? [k, -s[1]] : [k, 1]; renderObjects(r); };
    });
    document.querySelectorAll('tbody tr[data-id]').forEach(function (tr) {
      var open = function () { go('#object/' + tab + '/' + encodeURIComponent(tr.getAttribute('data-id'))); };
      tr.onclick = open;
      tr.onkeydown = function (e) { if (e.key === 'Enter') open(); };
    });
  }

  // ---------------------------------------------------------------- detail
  function renderDetail(r) {
    var o = find(r.id), v = document.getElementById('view');
    if (!o) { v.innerHTML = '<a class="back" href="#objects/' + esc(r.tab) + '">' + icon('back') + esc(t('back')) + '</a><div class="empty">' + esc(t('nf')) + '</div>'; return; }
    var kv = [];
    function row(k, val) { if (val !== '' && val !== null && val !== undefined) kv.push('<div class="k">' + esc(t(k)) + '</div><div>' + val + '</div>'); }
    row('kId', esc(o.id));
    row('kOwner', o.owner ? esc(o.owner) : '<span class="muted">&ndash;</span>');
    row('kStatus', statusPill(o.status));
    row('kExpires', o.expire ? esc(fDate(o.expire, true)) + ' <span class="muted">&middot; ' + esc(relDays(o.days)) + '</span>' : '<span class="muted">&ndash;</span>');
    row('kUrgency', urgBadge(o.urgency));
    row('kTriggers', o.triggers.length ? esc(o.triggers.slice().sort(function (a, b) { return b - a; }).map(function (n) { return t('daysWord', { n: n }); }).join(' · ')) : '');
    row('kChannel', o.mailOn ? esc(t('mailOn')) : '<span class="neg">' + esc(t('mailOff')) + '</span>');
    row('kServer', esc(o.server));
    row('kEnv', esc(o.env));
    row('kTemplate', esc(o.template));
    row('kSource', esc(o.source || t('manual')));
    row('kSeverity', esc(o.severity));
    if (o.link && /^https:\/\//i.test(o.link)) row('kLink', '<a href="' + esc(o.link) + '" target="_blank" rel="noopener noreferrer">' + esc(t('openLink')) + '</a>');
    row('kCopied', o.copied ? esc(fDate(o.copied, true)) : '');

    var hist = o.schedule.slice().reverse().map(function (s) {
      var ic = s.state === 'sent' ? 'mail' : s.state === 'due' ? 'bell' : s.state === 'skipped' ? 'skip' : 'clock';
      var when = s.sentAt ? fDateTime(s.sentAt) : fDate(s.date, true) + ' · ' + relDays(daysFrom(s.date));
      var what = s.state === 'sent' ? t('sSent') : s.state === 'due' ? t('sDue') : s.state === 'skipped' ? t('sSkipped') : t('sPending');
      return '<li><div class="ic ' + s.state + '">' + icon(ic) + '</div><div><div class="when">' + esc(when) + '</div><div class="what"><b>' + esc(kindLabel(s)) + '</b> &ndash; ' + esc(what) + '</div></div></li>';
    }).join('');

    var mailKv = '<div class="kv">' +
      '<div class="k">' + esc(t('kSender')) + '</div><div>' + (o.sender ? esc(o.sender) : '<span class="muted">&ndash;</span>') + '</div>' +
      '<div class="k">' + esc(t('kRecipients')) + '</div><div>' + (o.recipients.length ? o.recipients.map(esc).join('<br>') : '<span class="muted">&ndash;</span>') + '</div>' +
      '<div class="k">' + esc(t('kSubject')) + '</div><div>' + (o.subject ? esc(o.subject) : '<span class="muted">&ndash;</span>') + '</div></div>';

    v.innerHTML =
      '<div class="detail-top"><a class="back" href="#objects/' + esc(r.tab) + '">' + icon('back') + esc(t('back')) + '</a>' +
      '<div class="detail-actions">' + (M.editLink ? '<a href="#edit">' + icon('edit') + esc(t('editTip')) + '</a>' : '') +
      '<button type="button" id="dPrint">' + icon('print') + esc(t('print')) + '</button></div></div>' +
      '<div class="who"><div class="avatar" style="--c:var(' + UC[o.urgency] + ')">' + icon(o.urgency === 'expired' || o.urgency === 'critical' ? 'alert' : 'calendar') + '</div>' +
      '<div><h2>' + esc(o.name) + '</h2><div class="sub">' + esc([o.server, o.env].filter(Boolean).join(' · ')) + '</div></div></div>' +
      '<div class="grid-detail">' +
        '<div class="card"><div class="hd">' + esc(t('about')) + '</div><div class="bd"><div class="kv">' + kv.join('') + '</div></div></div>' +
        '<div class="col">' +
          '<div class="card"><div class="subtabs"><button type="button" data-s="action" class="' + (UI.sub === 'action' ? 'active' : '') + '">' + esc(t('action')) + '</button>' +
            '<button type="button" data-s="mail" class="' + (UI.sub === 'mail' ? 'active' : '') + '">' + esc(t('mail')) + '</button></div>' +
            '<div class="bd" id="subbody">' + (UI.sub === 'mail' ? mailKv : '<div class="prose">' + (o.desc ? esc(o.desc) : '<span class="muted">' + esc(t('noDesc')) + '</span>') + '</div>') + '</div></div>' +
          '<div class="card"><div class="hd light">' + icon('clock') + esc(t('history')) + '</div><div class="bd">' +
            (o.mailOn ? '' : '<div class="banner" style="margin:0 0 8px">' + icon('belloff') + '<div>' + esc(t('mailOffNote')) + '</div></div>') +
            (hist ? '<ul class="feed">' + hist + '</ul>' : '<div class="empty">&ndash;</div>') + '</div></div>' +
        '</div>' +
      '</div>';
    document.getElementById('dPrint').onclick = function () { window.print(); };
    document.querySelectorAll('.subtabs button').forEach(function (b) { b.onclick = function () { UI.sub = b.getAttribute('data-s'); renderDetail(r); }; });
  }

  // ---------------------------------------------------------------- CSV
  function exportCsv(r) {
    var tab = r.view === 'overview' ? 'monitored' : r.tab, f = r.view === 'objects' ? filtered(tab) : { rows: TABS.filter(function (x) { return x.k === tab; })[0].rows(), cols: COLS[tab] };
    if (r.view === 'object') { var o = find(r.id); f.rows = o ? [o] : []; }
    var sep = LANG === 'sv' ? ';' : ',';
    var cell = function (v) { v = v === null || v === undefined ? '' : String(v); return /[";,\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
    var cols = f.cols.concat(tab === 'invalid' || tab === 'nocreds' ? [] : [
      { l: 'kServer', csv: function (x) { return x.server; } }, { l: 'kEnv', csv: function (x) { return x.env; } },
      { l: 'kRecipients', csv: function (x) { return (x.recipients || []).join(' '); } }]);
    var lines = [cols.map(function (c) { return cell(t(c.l)); }).join(sep)].concat(f.rows.map(function (x) { return cols.map(function (c) { return cell(c.csv(x)); }).join(sep); }));
    var blob = new Blob(['﻿' + lines.join('\r\n') + '\r\n'], { type: 'text/csv;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'psToDo-' + tab + '-' + new Date().toISOString().slice(0, 10) + '.csv';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
  }

  // ---------------------------------------------------------------- theme + editor
  function isDark() {
    var a = document.documentElement.getAttribute('data-theme');
    if (a === 'dark') return true;
    if (a === 'light') return false;
    return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  }
  function setTheme(th) {
    document.documentElement.setAttribute('data-theme', th); save('theme', th);
    var f = document.getElementById('editFrame');
    if (f && f.contentWindow) { try { f.contentWindow.postMessage({ psToDo: 'theme', theme: th }, '*'); } catch (e) { } }
    renderShell(route());
  }
  function renderEdit() {
    var th = isDark() ? 'dark' : 'light';
    document.getElementById('view').innerHTML = '';
    var host = document.getElementById('editHost'); host.hidden = false;
    if (!document.getElementById('editFrame')) {
      host.innerHTML = '<iframe class="editframe" id="editFrame" title="' + esc(t('editView')) + '" src="edit.html?embed=1&amp;theme=' + th + '"></iframe>';
    }
  }

  // ---------------------------------------------------------------- go
  function render() {
    var r = route();
    renderShell(r);
    if (r.view === 'edit') { renderEdit(); return; }
    document.getElementById('editHost').hidden = true;
    if (r.view === 'overview') renderOverview();
    else if (r.view === 'objects') renderObjects(r);
    else renderDetail(r);
    window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', render);
  render();
})();
</script>
</body>
</html>
